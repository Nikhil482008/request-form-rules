<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motadata Prototypes — Hub</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; background: #fff; color: #364658; }

  /* ── universal rail ─────────────────────────────────────────
     The product's own icon rail, drawn by the HUB rather than by each
     prototype — so it stays put when you move between them. Only the
     module icons navigate; the rest are the product's furniture. */
  .rail { flex: 0 0 56px; background: #fff; border-right: 1px solid #DFE5ED;
          display: flex; flex-direction: column; align-items: center;
          padding: 12px 0 10px; gap: 3px; position: relative; z-index: 30; }
  .rail hr { width: 22px; border: 0; border-top: 1px solid #DFE5ED; margin: 4px 0; }
  .rail .sp { flex: 1 1 auto; }
  .ic { width: 32px; height: 32px; border: 0; background: none; border-radius: 4px; color: #7B8FA5;
        display: grid; place-items: center; cursor: pointer; position: relative;
        transition: background .12s, color .12s; }
  .ic:hover { background: #F5F7FA; color: #364658; }
  .ic.on { background: #3D8BD0; color: #fff; }
  .ic[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px);
        top: 50%; transform: translateY(-50%); background: #364658; color: #fff; font-size: 12px;
        padding: 5px 9px; border-radius: 4px; white-space: nowrap; z-index: 40; }
  .ic.nav::before { content: ""; position: absolute; right: 3px; top: 4px; width: 4px; height: 4px;
        border-radius: 50%; background: #3D8BD0; }
  .ic.nav.on::before { background: #fff; }

  /* ── flyout ─────────────────────────────────────────────────── */
  .fly { position: fixed; left: 56px; top: 0; bottom: 0; width: 248px; background: #fff;
         border-right: 1px solid #DFE5ED; box-shadow: 8px 0 24px -12px rgba(16,24,40,.25);
         z-index: 25; overflow-y: auto; padding: 12px 8px 16px; display: none; }
  .fly.open { display: block; }
  .fly h4 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
            color: #7B8FA5; padding: 12px 10px 6px; }
  .fly h4:first-child { padding-top: 4px; }
  .fly button { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
                font-size: 13px; color: #364658; padding: 8px 10px; border-radius: 4px;
                transition: background .12s, color .12s; }
  .fly button:hover { background: #F9FAFB; }
  .fly button.active { background: #EBF5FF; color: #3D8BD0; font-weight: 600; }
  .fly button .sub { color: #9CA3AF; font-size: 11px; margin-left: 6px; font-weight: 400; }
  .scrim { position: fixed; inset: 0 0 0 56px; z-index: 20; display: none; }
  .scrim.open { display: block; }

  main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  iframe { width: 100%; height: 100%; border: 0; display: block; flex: 1 1 auto; }
</style>
</head>
<body>

<nav class="rail" id="rail"></nav>
<div class="scrim" id="scrim"></div>
<aside class="fly" id="fly"></aside>

<main><iframe id="frame" title="Prototype" src="about:blank"></iframe></main>

<script>
  /* Every prototype lives under one of these module groups. The rail shows
     the module; the flyout shows what is inside it. */
  var GROUPS = {
    form: { name: "Request Form Rules", items: [
      { id:"v0",   label:"Rules without Blocks",        sub:"V0" },
      { id:"v01",  label:"Block Recommendations",       sub:"V0.1" },
      { id:"v03",  label:"Smart Block Recommendations", sub:"V0.3" },
      { id:"v11",  label:"Field Rule Workspace",        sub:"V11" },
      { id:"v112", label:"Field Rule Workspace",        sub:"V11.2" },
      { id:"v12",  label:"Multi-Field Rule Workspace",  sub:"V12" },
      { id:"v10",  label:"Form Builder",                sub:"V10" },
      { id:"v102", label:"Rule Block Display",          sub:"V10.2" },
      { id:"v103", label:"Rule Landmarks",              sub:"V10.3" },
      { id:"v1",   label:"Sentence-First Builder",      sub:"V1" },
      { id:"v2",   label:"Structured Form",             sub:"V2" },
      { id:"v3",   label:"Block Workspace",             sub:"V3" },
      { id:"v4",   label:"Starter Cards",               sub:"V4" },
      { id:"v5",   label:"Guided Composer",             sub:"V5" },
      { id:"v6",   label:"Refined Classic Form",        sub:"V6" },
      { id:"v7",   label:"Progressive Workspace",       sub:"V7" },
      { id:"v8",   label:"Guided Form Canvas",          sub:"V8" },
      { id:"v9",   label:"Rule Sequence Workspace",     sub:"V9" },
      { id:"v92",  label:"Guided Sequence Editor",      sub:"V9.2" },
      { id:"v101", label:"Service Catalog + Rules",     sub:"V10.1" }
    ]},
    /* Clicking BOM lands on BOM Administration (`landing`) with the module menu
       open beside it — dismiss the menu and you are on the hub, or pick a
       section directly. The hub's three cards reach the same three sections. */
    bom: { name: "BOM", landing: "bomadm", items: [
      { id:"bomadm", label:"BOM Administration",   sub:"" },
      { id:"bomlic", label:"BOM Licensing",        sub:"" },
      { id:"bomsch", label:"BOM Scheduler",        sub:"" },
      { id:"bomret", label:"BOM Retention",        sub:"" },
      { id:"bom",    label:"Component Intelligence", sub:"SBOM · CBOM" }
    ]}
  };

  var SRC = {
    v0:"rule-studio-v0.html", v01:"rule-studio-v0-1.html", v03:"rule-studio-v0-3.html",
    v11:"rule-studio-v11.html", v112:"rule-studio-v11-2.html", v12:"rule-studio-v12.html",
    v10:"rule-studio-v10.html", v102:"rule-studio-v10-2.html", v103:"rule-studio-v10-3.html",
    v1:"rule-studio-v1.html", v2:"rule-studio-demo.html", v3:"rule-studio-v3.html",
    v4:"rule-studio-v4.html", v5:"rule-studio-v5.html", v6:"rule-studio-v6.html",
    v7:"rule-studio-v7.html", v8:"rule-studio-v8.html", v9:"rule-studio-v9.html",
    v92:"rule-studio-v9-2.html", v101:"rule-studio-v10-1.html",
    bom:   "BOM/concepts/component-inventory.html#/bom/components",
    bomadm:"BOM/concepts/component-inventory.html#/admin",
    bomlic:"BOM/concepts/component-inventory.html#/admin/bom-licensing",
    bomsch:"BOM/concepts/component-inventory.html#/admin/bom-scheduler",
    bomret:"BOM/concepts/component-inventory.html#/admin/bom-retention"
  };

  /* The product rail, icon for icon. `group` makes an icon navigate; the
     rest are the surrounding module set and stay inert, as in the app. */
  var S = 'width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"';
  var RAIL = [
    { tip:"Dashboard",     svg:'<svg '+S+'><circle cx="9" cy="9" r="7"/><path d="M9 9l3.5-3.5"/></svg>' },
    { tip:"Request Form Rules", group:"form", svg:'<svg '+S+'><rect x="2" y="4" width="14" height="10" rx="2"/><path d="M6 4v10"/></svg>' },
    { tip:"Users",         svg:'<svg '+S+'><circle cx="7" cy="6" r="2.6"/><path d="M2.5 15c0-2.6 2-4.2 4.5-4.2s4.5 1.6 4.5 4.2"/></svg>' },
    { tip:"Workflow",      svg:'<svg '+S+'><path d="M4 3v8a3 3 0 003 3h7"/><path d="M11 11l3 3-3 3"/></svg>' },
    { tip:"Releases",      svg:'<svg '+S+'><path d="M9 12V3M5.5 6.5L9 3l3.5 3.5"/><path d="M3 12v3h12v-3"/></svg>' },
    { tip:"Assets",        svg:'<svg '+S+'><rect x="2.5" y="4" width="13" height="8.5" rx="1.6"/><path d="M6 15h6"/></svg>' },
    { tip:"Contracts",     svg:'<svg '+S+'><rect x="3.5" y="2.5" width="11" height="13" rx="1.6"/><path d="M6 6h6M6 9h6M6 12h3.5"/></svg>' },
    { tip:"Vulnerability", svg:'<svg '+S+'><path d="M9 2l5.5 2.4v4.3c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7V4.4L9 2z"/></svg>' },
    { tip:"Patch Management", svg:'<svg '+S+'><circle cx="9" cy="9" r="2.4"/><path d="M9 1.6v2.2M9 14.2v2.2M1.6 9h2.2M14.2 9h2.2"/></svg>' },
    { tip:"CMDB",          svg:'<svg '+S+'><path d="M9 2l6 3.4v7.2L9 16l-6-3.4V5.4L9 2z"/></svg>' },
    { tip:"BOM", group:"bom", svg:'<svg '+S+' stroke-width="1.5"><path d="M9 2.5l6 3v7l-6 3-6-3v-7l6-3z"/><path d="M3.4 5.6L9 8.4l5.6-2.8M9 8.4V15"/></svg>' },
    { tip:"Discovery",     svg:'<svg '+S+'><circle cx="9" cy="5.5" r="2"/><circle cx="4.5" cy="13" r="2"/><circle cx="13.5" cy="13" r="2"/><path d="M9 7.5v2M7.5 11l-1.4-1M10.5 11l1.4-1"/></svg>' },
    { tip:"Automation",    svg:'<svg '+S+'><path d="M9 2.5v3M9 12.5v3M2.5 9h3M12.5 9h3"/><circle cx="9" cy="9" r="3"/></svg>' },
    { tip:"Reports",       svg:'<svg '+S+'><rect x="3" y="3" width="12" height="12" rx="1.8"/><path d="M6 11.5V8M9 11.5v-5M12 11.5v-2.5"/></svg>' },
    { tip:"Approvals",     svg:'<svg '+S+'><circle cx="7" cy="6" r="2.4"/><path d="M2.5 14.5c0-2.4 2-4 4.5-4"/><path d="M10.5 12.5l1.8 1.8 3.2-3.6"/></svg>' },
    { tip:"Tasks",         svg:'<svg '+S+'><path d="M3 5l1.6 1.6L7.5 3.7M3 12l1.6 1.6 2.9-2.9M10 5.5h5M10 12.5h5"/></svg>' },
    { spacer:true },
    /* Direct shortcut to BOM Administration — the landing page whose cards
       reach Licensing, Scheduler and Retention. */
    { tip:"Admin", go:"bomadm", svg:'<svg '+S+' stroke-width="1.5"><path d="M3 5h5M11.5 5H15M3 13h3.5M10 13h5"/><circle cx="9.6" cy="5" r="1.9"/><circle cx="8.2" cy="13" r="1.9"/></svg>' }
  ];

  var railEl = document.getElementById("rail");
  var flyEl  = document.getElementById("fly");
  var scrim  = document.getElementById("scrim");
  var frame  = document.getElementById("frame");
  var current = null, openGroup = null;

  /* No style is injected into the frame any more. The rail was being hidden
     with CSS, which left it in the markup and depended on same-origin access —
     it is now deleted from the prototypes themselves, so this shell is the only
     place module icons are drawn. */
  var BUILD = "20260808o";
  /* Cache-buster goes BEFORE the fragment, or the route is lost. The counter
     makes every URL unique, so assigning it to .src is always a real document
     load — two URLs differing only after the "#" would not reload at all, and
     that silence is how the frame kept showing the previous screen. */
  var navSeq = 0;
  function frameUrl(id){
    var src = SRC[id], i = src.indexOf("#"), q = "?b=" + BUILD + "&n=" + (++navSeq);
    return i < 0 ? src + q : src.slice(0, i) + q + src.slice(i);
  }
  /* The five BOM entries are ONE document at different hashes, so moving
     between them must not reload — enrolling a CI in Licensing is what gates
     Scheduler and Retention, and a reload would wipe it.

     Writing the frame's hash was the obvious way and it is unreliable: the
     assignment is a no-op when the value has not literally changed, so a page
     whose address already said "#/admin" while showing something else simply
     stayed put. Call the document's own router instead, and fall back to a
     full load when it isn't reachable (file://, or a stale cached copy). */
  function navFrame(id){
    var url = frameUrl(id), i = url.indexOf("#"), target = i > -1 ? url.slice(i) : "";
    try {
      var w = frame.contentWindow;
      /* Same document already mounted: ask its router to switch view and report
         back which view it settled on. Only a matching answer counts as done —
         anything else drops through to the reload below. */
      if (w && target && typeof w.bomNavigate === "function" &&
          w.location.pathname === new URL(url, location.href).pathname &&
          w.bomNavigate(target) === w.bomViewOf(target)) return;
    } catch (e) { /* cross-origin frame — fall through to a full load */ }
    frame.src = url;
  }
  function groupOf(id){
    for (var g in GROUPS) if (GROUPS[g].items.some(function(x){ return x.id === id; })) return g;
    return "form";
  }
  function known(id){ return !!SRC[id]; }

  function select(id, push){
    if (!known(id)) id = "v0";
    current = id;
    navFrame(id);
    var g = groupOf(id), item = GROUPS[g].items.filter(function(x){ return x.id === id; })[0];
    Array.prototype.forEach.call(railEl.querySelectorAll(".ic"), function(b){
      var on = b.dataset.group === g;
      /* The Admin shortcut lights for the admin screens themselves, not for
         the rest of the module it happens to live in. */
      if (b.dataset.go) on = g === "bom" && id !== "bom";
      b.classList.toggle("on", on);
    });
    if (push && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    document.title = "Hub · " + item.label;
    closeFly();
  }

  function openFly(g){
    openGroup = g;
    flyEl.innerHTML = "";
    var h = document.createElement("h4");
    h.textContent = GROUPS[g].name;
    flyEl.appendChild(h);
    GROUPS[g].items.forEach(function(v){
      var b = document.createElement("button");
      b.className = v.id === current ? "active" : "";
      b.innerHTML = v.label + (v.sub ? "<span class='sub'>" + v.sub + "</span>" : "");
      b.addEventListener("click", function(){ select(v.id, true); });
      flyEl.appendChild(b);
    });
    flyEl.classList.add("open");
    scrim.classList.add("open");
  }
  function closeFly(){ openGroup = null; flyEl.classList.remove("open"); scrim.classList.remove("open"); }
  scrim.addEventListener("click", closeFly);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeFly(); });

  /* No burger here — the product draws its own in the topbar, and the three lit
     icons already reach every prototype. */
  RAIL.forEach(function(r){
    if (r.spacer){
      var sp = document.createElement("div"); sp.className = "sp"; railEl.appendChild(sp);
      railEl.appendChild(document.createElement("hr"));
      return;
    }
    var b = document.createElement("button");
    b.className = "ic" + (r.group || r.go ? " nav" : "");
    b.setAttribute("data-tip", r.tip);
    if (r.group) b.dataset.group = r.group;
    if (r.go)    b.dataset.go = r.go;
    b.innerHTML = r.svg;
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (r.go){ select(r.go, true); return; }   // Admin → BOM Administration
      if (!r.group) return;                      // inert module, as in the product
      if (openGroup === r.group){ closeFly(); return; }
      /* A module opens ON its landing page AND offers its menu — the landing
         renders behind the flyout, so dismissing the menu leaves you on the
         module's hub rather than wherever you came from. */
      var G = GROUPS[r.group];
      if (G.landing) select(G.landing, true);
      openFly(r.group);
    });
    railEl.appendChild(b);
  });

  var start = (location.hash || "").replace("#", "");
  select(known(start) ? start : "v0", false);    // V0 is the default
  window.addEventListener("hashchange", function(){
    var id = (location.hash || "").replace("#", "");
    if (known(id) && id !== current) select(id, false);
  });
</script>
</body>
</html>
